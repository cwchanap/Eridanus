name: Prepare HPA-22 generated assets

on:
  push:
    branches:
      - jack65786656/hpa-22-tower-maze-generate-and-integrate-the-reusable-mvp-image
    paths:
      - .github/workflows/hpa22-prepare-assets.yml

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      TERRAIN_URL: 'https://storage.googleapis.com/xi-backend/database/workspace/eb316816cff3434592cdf4758c204382/content_generation/aATO90DFMt4N7oYOJj7l/9Hb71kp7bmC6Rtq2YBWs/content.png?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=xi-backend-prod%40xi-labs.iam.gserviceaccount.com%2F20260917%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260917T185300Z&X-Goog-Expires=7200&X-Goog-SignedHeaders=host&X-Goog-'
      PLAYER_URL: 'https://storage.googleapis.com/xi-backend/database/workspace/eb316816cff3434592cdf4758c204382/content_generation/ixONDnoxTiAe6nqZcqLU/hed2WCXhNagkmZlYMybx/content.png?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=xi-backend-prod%40xi-labs.iam.gserviceaccount.com%2F20260917%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260917T185302Z&X-Goog-Expires=7200&X-Goog-SignedHeaders=host&X-Goog-'
      ACTORS_URL: 'https://storage.googleapis.com/xi-backend/database/workspace/eb316816cff3434592cdf4758c204382/content_generation/jFq9gicmvKeTK3EFFU4Q/LgT8lvu7ByUQPVKROs5u/content.png?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=xi-backend-prod%40xi-labs.iam.gserviceaccount.com%2F20260917%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260917T185300Z&X-Goog-Expires=7200&X-Goog-SignedHeaders=host&X-Goog-'
      INTERACTABLES_URL: 'https://storage.googleapis.com/xi-backend/database/workspace/eb316816cff3434592cdf4758c204382/content_generation/kKPdeg75LN6K3xqhuYww/UtLaSAAlJfbCyfof2uKb/content.png?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=xi-backend-prod%40xi-labs.iam.gserviceaccount.com%2F20260917%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260917T185307Z&X-Goog-Expires=7200&X-Goog-SignedHeaders=host&X-Goog-'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow numpy
      - name: Download, crop, normalize
        shell: bash
        run: |
          python - <<'PY'
          import os
          import urllib.request
          from collections import deque
          from pathlib import Path

          import numpy as np
          from PIL import Image

          root = Path('prepared')
          sources = root / '_sources'
          sources.mkdir(parents=True, exist_ok=True)

          urls = {
              'terrain': os.environ['TERRAIN_URL'],
              'players': os.environ['PLAYER_URL'],
              'actors': os.environ['ACTORS_URL'],
              'interactables': os.environ['INTERACTABLES_URL'],
          }
          for name, url in urls.items():
              urllib.request.urlretrieve(url, sources / f'{name}.png')

          def remove_edge_background(image: Image.Image) -> Image.Image:
              image = image.convert('RGBA')
              arr = np.array(image)
              if arr[..., 3].min() < 250:
                  return image
              rgb = arr[..., :3].astype(np.int16)
              border = np.concatenate([
                  rgb[0, :, :], rgb[-1, :, :], rgb[:, 0, :], rgb[:, -1, :]
              ], axis=0)
              bg = np.median(border, axis=0)
              dist = np.sqrt(((rgb - bg) ** 2).sum(axis=2))
              candidate = dist < 48
              h, w = candidate.shape
              seen = np.zeros((h, w), dtype=bool)
              q = deque()
              for x in range(w):
                  if candidate[0, x]: q.append((0, x))
                  if candidate[h - 1, x]: q.append((h - 1, x))
              for y in range(h):
                  if candidate[y, 0]: q.append((y, 0))
                  if candidate[y, w - 1]: q.append((y, w - 1))
              while q:
                  y, x = q.popleft()
                  if y < 0 or y >= h or x < 0 or x >= w or seen[y, x] or not candidate[y, x]:
                      continue
                  seen[y, x] = True
                  q.extend(((y-1,x),(y+1,x),(y,x-1),(y,x+1)))
              arr[seen, 3] = 0
              return Image.fromarray(arr, 'RGBA')

          def fit_sprite(cell: Image.Image, out_path: Path):
              sprite = remove_edge_background(cell)
              alpha = sprite.getchannel('A')
              bbox = alpha.getbbox()
              if bbox:
                  sprite = sprite.crop(bbox)
              max_w = max_h = 60
              scale = min(max_w / sprite.width, max_h / sprite.height, 1.0)
              size = (max(1, round(sprite.width * scale)), max(1, round(sprite.height * scale)))
              sprite = sprite.resize(size, Image.Resampling.LANCZOS)
              canvas = Image.new('RGBA', (64, 64), (0, 0, 0, 0))
              x = (64 - sprite.width) // 2
              y = 62 - sprite.height
              canvas.alpha_composite(sprite, (x, y))
              out_path.parent.mkdir(parents=True, exist_ok=True)
              canvas.save(out_path)

          def square_center(img: Image.Image):
              side = min(img.width, img.height)
              left = (img.width - side) // 2
              top = (img.height - side) // 2
              return img.crop((left, top, left + side, top + side))

          # Terrain: central square split 2x2, row-major.
          terrain = square_center(Image.open(sources / 'terrain.png').convert('RGB'))
          terrain_names = [
              'terrain/village-floor.png', 'terrain/village-wall.png',
              'terrain/dungeon-floor.png', 'terrain/dungeon-wall.png',
          ]
          cw, ch = terrain.width // 2, terrain.height // 2
          for i, rel in enumerate(terrain_names):
              row, col = divmod(i, 2)
              cell = terrain.crop((col*cw, row*ch, (col+1)*cw, (row+1)*ch))
              out = root / 'public/assets' / rel
              out.parent.mkdir(parents=True, exist_ok=True)
              cell.resize((32, 32), Image.Resampling.LANCZOS).save(out)

          # Player: central square split 2x2, row-major N/S/E/W.
          players = square_center(Image.open(sources / 'players.png'))
          player_names = [
              'characters/player-north.png', 'characters/player-south.png',
              'characters/player-east.png', 'characters/player-west.png',
          ]
          cw, ch = players.width // 2, players.height // 2
          for i, rel in enumerate(player_names):
              row, col = divmod(i, 2)
              fit_sprite(players.crop((col*cw, row*ch, (col+1)*cw, (row+1)*ch)), root / 'public/assets' / rel)

          # Actors: split left/right, then central-square each half.
          actors = Image.open(sources / 'actors.png')
          actor_names = ['characters/npc-village-guide.png', 'enemies/ruin-guard.png']
          half = actors.width // 2
          for i, rel in enumerate(actor_names):
              cell = actors.crop((i*half, 0, (i+1)*half, actors.height))
              fit_sprite(square_center(cell), root / 'public/assets' / rel)

          # Interactables: 4 columns x 2 rows, row-major.
          inter = Image.open(sources / 'interactables.png')
          inter_names = [
              'interactables/stairs-up.png', 'interactables/stairs-down.png',
              'interactables/recovery-waystone.png', 'interactables/clue-runes.png',
              'interactables/shortcut-gate-closed.png', 'interactables/shortcut-gate-open.png',
              'interactables/chest-relic-closed.png', 'interactables/chest-relic-open.png',
          ]
          cw, ch = inter.width // 4, inter.height // 2
          for i, rel in enumerate(inter_names):
              row, col = divmod(i, 4)
              cell = inter.crop((col*cw, row*ch, (col+1)*cw, (row+1)*ch))
              fit_sprite(square_center(cell), root / 'public/assets' / rel)

          # Verify runtime dimensions.
          for path in (root / 'public/assets').rglob('*.png'):
              with Image.open(path) as image:
                  if '/terrain/' in path.as_posix():
                      assert image.size == (32, 32), (path, image.size)
                  else:
                      assert image.width <= 64 and image.height <= 64, (path, image.size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hpa22-prepared-assets
          path: prepared
          if-no-files-found: error
          retention-days: 1
