name: Format HPA-22 planning docs

on:
  push:
    branches:
      - jack65786656/hpa-22-tower-maze-generate-and-integrate-the-reusable-mvp-image
    paths:
      - .github/workflows/hpa22-format-docs.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Format planning docs
        run: |
          bunx prettier --write \
            docs/superpowers/plans/2026-09-17-hpa-22-mvp-image-asset-kit.md \
            docs/superpowers/specs/2026-09-17-hpa-22-mvp-image-asset-kit-design.md
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/superpowers/plans/2026-09-17-hpa-22-mvp-image-asset-kit.md docs/superpowers/specs/2026-09-17-hpa-22-mvp-image-asset-kit-design.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs: format HPA-22 planning files'
          git push origin HEAD:${GITHUB_REF_NAME}
