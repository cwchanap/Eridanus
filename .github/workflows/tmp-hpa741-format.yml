name: Temporary HPA-741 Docs Formatting

on:
  push:
    branches:
      - docs/hpa-741-floors-6-10-design-plan

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write docs/superpowers/specs/2026-11-06-hpa-741-deep-floors-design.md docs/superpowers/plans/2026-11-06-hpa-741-deep-floors.md
      - name: Commit formatted documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/specs/2026-11-06-hpa-741-deep-floors-design.md docs/superpowers/plans/2026-11-06-hpa-741-deep-floors.md
          if ! git diff --cached --quiet; then
            git commit -m "docs(hpa-741): format design and plan with prettier"
            git push origin HEAD:docs/hpa-741-floors-6-10-design-plan
          fi
